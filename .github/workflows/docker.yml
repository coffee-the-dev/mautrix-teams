name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GOTOOLCHAIN: local
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        run: |
          SHA8="$(git rev-parse --short=7 HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:sha-${SHA8}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:main,${IMAGE}:sha-${SHA8}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
